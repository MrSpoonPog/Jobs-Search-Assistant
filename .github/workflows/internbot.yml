name: internbot

on:
  schedule:
    # every 4 hours - alert the moment something new lands
    - cron: '0 */4 * * *'
    # 07:00 UTC = 08:00 BST, weekdays - the daily digest
    - cron: '0 7 * * 1-5'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      mode:
        description: 'new or digest'
        default: 'new'

permissions:
  contents: write             # needed to commit seen.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 1-5" ]; then
            echo "mode=digest" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ github.event.inputs.mode || 'new' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run internbot
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python fetch.py --mode ${{ steps.mode.outputs.mode }}

      - name: Save state
        run: |
          git config user.name  "internbot"
          git config user.email "internbot@users.noreply.github.com"
          git add seen.json job_log.csv 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%Y-%m-%d\ %H:%M)"
          # the 4-hourly run and the 08:00 digest can overlap, so rebase on
          # whatever landed first rather than losing this run's state
          git pull --rebase --autostash || true
          git push || true
